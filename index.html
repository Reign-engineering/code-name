<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>配電工程常用材料與工量查詢</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { color: #1a568c; margin-top: 0; margin-bottom: 20px; }
    
    /* 頁籤樣式 */
    .tabs { display: flex; border-bottom: 2px solid #e0e0e0; margin-bottom: 20px; }
    .tab-btn { padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; background: none; color: #666; border-bottom: 3px solid transparent; transition: 0.3s; }
    .tab-btn.active { color: #1a568c; border-bottom-color: #1a568c; }
    
    /* 搜尋框 */
    .search-box { display: flex; gap: 10px; margin-bottom: 15px; }
    .search-box input { flex: 1; padding: 12px 15px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; outline: none; }
    .search-box input:focus { border-color: #1a568c; box-shadow: 0 0 5px rgba(26,86,140,0.3); }
    
    .status { margin-bottom: 15px; font-size: 14px; color: #666; }
    
    /* 表格樣式 */
    .table-wrapper { overflow-x: auto; max-height: 65vh; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th, td { border: 1px solid #e0e0e0; padding: 10px 12px; text-align: left; }
    th { background-color: #1a568c; color: white; position: sticky; top: 0; z-index: 10; }
    tr:nth-child(even) { background-color: #f8f9fa; }
    tr:hover { background-color: #eef5fc; }
    
    /* 標籤 */
    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-single { background-color: #e3f2fd; color: #0d47a1; }
    .badge-group { background-color: #fff3e0; color: #e65100; }
  </style>
</head>
<body>

<div class="container">
  <h2>配電工程查詢系統</h2>
  
  <!-- 頁籤切換 -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('material')">材料查詢</button>
    <button class="tab-btn" onclick="switchTab('work')">工量查詢</button>
  </div>
  
  <div class="search-box">
    <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="輸入關鍵字進行搜尋...">
  </div>
  
  <div class="status" id="statusMsg">資料載入中...</div>

  <div class="table-wrapper">
    <table id="dataTable">
      <thead><tr id="tableHeader"></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
  let allData = { material: [], work: [] };
  let currentTab = 'material';

  window.onload = function() {
    google.script.run
      .withSuccessHandler(onDataLoaded)
      .withFailureHandler(handleError)
      .getAllSheetsData();
  };

  function onDataLoaded(data) {
    allData = data;
    renderCurrentTab();
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('searchInput').value = '';
    renderCurrentTab();
  }

  function renderCurrentTab() {
    const data = allData[currentTab];
    if (!data || data.length === 0) {
      document.getElementById('statusMsg').innerText = '無資料可供顯示。';
      document.getElementById('tableHeader').innerHTML = '';
      document.getElementById('tableBody').innerHTML = '';
      return;
    }

    const header = data[0];
    const rows = data.slice(1);

    // 渲染表頭
    let headerHtml = '';
    header.forEach(col => { headerHtml += `<th>${col}</th>`; });
    document.getElementById('tableHeader').innerHTML = headerHtml;

    // 渲染資料
    displayRows(rows);
    document.getElementById('statusMsg').innerText = `已載入 ${rows.length} 筆資料`;
  }

  function displayRows(rows) {
    let bodyHtml = '';
    rows.forEach(row => {
      bodyHtml += '<tr>';
      row.forEach((cell, index) => {
        let cellValue = cell !== null && cell !== undefined ? cell : '';
        
        // 「材料」頁籤的單項/組合組件樣式化
        if (currentTab === 'material' && index === 3) {
          if (cellValue === '單項') cellValue = `<span class="badge badge-single">${cellValue}</span>`;
          else if (cellValue === '組合組件') cellValue = `<span class="badge badge-group">${cellValue}</span>`;
        }
        
        bodyHtml += `<td>${cellValue}</td>`;
      });
      bodyHtml += '</tr>';
    });
    document.getElementById('tableBody').innerHTML = bodyHtml;
  }

  function filterTable() {
    const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
    const data = allData[currentTab];
    if (!data || data.length < 2) return;

    const rows = data.slice(1);
    const filteredRows = rows.filter(row => {
      return row.some(cell => String(cell).toLowerCase().includes(keyword));
    });

    displayRows(filteredRows);
    document.getElementById('statusMsg').innerText = `搜尋到 ${filteredRows.length} 筆符合資料`;
  }

  function handleError(err) {
    document.getElementById('statusMsg').innerText = '資料載入失敗：' + err.message;
  }
</script>

</body>
</html>
